name: Release macOS FFmpeg components

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-14
            expected_architecture: arm64
          - architecture: x64
            runner: macos-15-intel
            expected_architecture: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Intel assembler
        if: matrix.architecture == 'x64'
        run: brew install nasm

      - name: Build pinned tools and verify portable dependencies
        run: |
          chmod +x scripts/prepare-macos-tools.sh
          scripts/prepare-macos-tools.sh "${{ matrix.architecture }}"
          test "$(uname -m)" = "${{ matrix.expected_architecture }}"
          for tool in ffmpeg ffprobe libmp3lame.0.dylib; do
            lipo -archs "src-tauri/resources/macos/tools/$tool" | grep -x "${{ matrix.expected_architecture }}"
          done

      - name: Verify and package FFmpeg set
        run: |
          set -euo pipefail
          tools_dir="src-tauri/resources/macos/tools"
          test -x "$tools_dir/ffmpeg"
          test -x "$tools_dir/ffprobe"
          test -f "$tools_dir/libmp3lame.0.dylib"
          for tool in ffmpeg ffprobe libmp3lame.0.dylib; do
            codesign --force --sign - --timestamp=none "$tools_dir/$tool"
            codesign --verify --strict "$tools_dir/$tool"
          done
          "$tools_dir/ffmpeg" -hide_banner -encoders | grep -F 'libmp3lame' >/dev/null
          "$tools_dir/ffmpeg" -hide_banner -encoders | grep -F 'libopus' >/dev/null
          "$tools_dir/ffmpeg" -hide_banner -encoders | grep -E '[[:space:]]flac[[:space:]]' >/dev/null
          "$tools_dir/ffmpeg" -hide_banner -encoders | grep -E '[[:space:]]png[[:space:]]' >/dev/null
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          "$tools_dir/ffmpeg" -y -f lavfi -i 'sine=frequency=1000:sample_rate=44100:duration=0.1' -c:a libmp3lame "$smoke_dir/audio.mp3"
          "$tools_dir/ffmpeg" -y -f lavfi -i 'color=c=blue:s=64x64' -frames:v 1 "$smoke_dir/cover.png"
          "$tools_dir/ffmpeg" -y -i "$smoke_dir/audio.mp3" -i "$smoke_dir/cover.png" -c copy -map 0:0 -map 1:0 -id3v2_version 3 "$smoke_dir/audio-with-cover.mp3"
          "$tools_dir/ffprobe" -v error -select_streams v:0 -show_entries stream_disposition=attached_pic -of default=noprint_wrappers=1:nokey=1 "$smoke_dir/audio-with-cover.mp3" | grep -x '1'
          "$tools_dir/ffmpeg" -v error -y -i "$smoke_dir/audio.mp3" -c:a aac "$smoke_dir/audio.m4a"
          for output in opus flac; do
            encoder="$output"
            if [[ "$output" == "opus" ]]; then encoder="libopus"; fi
            "$tools_dir/ffmpeg" -v error -y -i "$smoke_dir/audio.m4a" -c:a "$encoder" -metadata title='Music smoke' "$smoke_dir/audio.$output"
            "$tools_dir/ffprobe" -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$smoke_dir/audio.$output" | grep -x "$output"
          done
          staging="$smoke_dir/component"
          mkdir -p "$staging"
          cp "$tools_dir/ffmpeg" "$tools_dir/ffprobe" "$tools_dir/libmp3lame.0.dylib" "$staging/"
          cp src-tauri/resources/macos/FFMPEG_LGPL-2.1.txt src-tauri/resources/macos/LAME_LGPL-2.0.txt src-tauri/resources/macos/OPUS_BSD.txt "$staging/"
          ffmpeg_version="$(sed -nE 's/^readonly FFMPEG_VERSION="([0-9.]+)"$/\1/p' scripts/prepare-macos-tools.sh)"
          lame_version="$(sed -nE 's/^readonly LAME_VERSION="([0-9.]+)"$/\1/p' scripts/prepare-macos-tools.sh)"
          opus_version="$(sed -nE 's/^readonly OPUS_VERSION="([0-9.]+)"$/\1/p' scripts/prepare-macos-tools.sh)"
          cat > "$staging/COMPONENTS.txt" <<EOF
          YTLoadster macOS FFmpeg component set
          Architecture: ${{ matrix.architecture }}
          FFmpeg and FFprobe: ${ffmpeg_version}
          Source: https://ffmpeg.org/releases/ffmpeg-${ffmpeg_version}.tar.xz
          ffmpeg SHA-256: $(shasum -a 256 "$staging/ffmpeg" | awk '{print $1}')
          ffprobe SHA-256: $(shasum -a 256 "$staging/ffprobe" | awk '{print $1}')
          License: LGPL-2.1-or-later; see FFMPEG_LGPL-2.1.txt
          LAME: ${lame_version}
          Source: https://downloads.sourceforge.net/project/lame/lame/${lame_version}/lame-${lame_version}.tar.gz
          libmp3lame SHA-256: $(shasum -a 256 "$staging/libmp3lame.0.dylib" | awk '{print $1}')
          License: LGPL-2.0; see LAME_LGPL-2.0.txt
          Opus: ${opus_version}; statically linked into FFmpeg and FFprobe
          Source: https://downloads.xiph.org/releases/opus/opus-${opus_version}.tar.gz
          License: BSD-3-Clause; see OPUS_BSD.txt
          EOF
          tar -czf "ffmpeg-macos-${{ matrix.architecture }}.tar.gz" -C "$staging" \
            ffmpeg ffprobe libmp3lame.0.dylib FFMPEG_LGPL-2.1.txt LAME_LGPL-2.0.txt OPUS_BSD.txt COMPONENTS.txt
          shasum -a 256 "ffmpeg-macos-${{ matrix.architecture }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-${{ matrix.architecture }}
          path: ffmpeg-macos-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-macos-*
          merge-multiple: true
          path: release-assets
      - name: Publish independent component release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^readonly FFMPEG_VERSION="([0-9.]+)"$/\1/p' scripts/prepare-macos-tools.sh)"
          test -n "$version"
          test -f release-assets/ffmpeg-macos-arm64.tar.gz
          test -f release-assets/ffmpeg-macos-x64.tar.gz
          gh release create "ffmpeg-components-${version}" \
            release-assets/ffmpeg-macos-arm64.tar.gz \
            release-assets/ffmpeg-macos-x64.tar.gz \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "FFmpeg components ${version}" \
            --notes "Проверенные комплекты FFmpeg, FFprobe и LAME для YTLoadster на macOS."
