[package]
name = "ytloadster"
version = "0.1.0"
description = "YouTube video, audio, and subtitle downloader for Windows and macOS"
authors = ["YTLoadster"]
license = "MIT"
publish = false
edition = "2021"

[lib]
name = "ytloadster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util", "time"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows-registry = "0.5"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
