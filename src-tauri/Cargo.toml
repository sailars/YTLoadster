[package]
name = "ytloadster"
version = "0.1.2"
description = "YouTube video, audio, and subtitle downloader for Windows and macOS"
authors = ["YTLoadster"]
license = "MIT"
publish = false
edition = "2021"

[lib]
name = "ytloadster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
url = "2"
percent-encoding = "2"
semver = "1"
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util", "time", "sync", "net"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows-registry = "0.5"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSNotification", "NSOperation", "NSString", "block2"] }
security-framework = "3.7"
